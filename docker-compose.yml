services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet_network
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALG=${JWT_ALG} 
      - JWT_EXPIRES_MIN=${JWT_EXPIRES_MIN}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT}
      - LOGIN_RATE_WINDOW_SEC=${LOGIN_RATE_WINDOW_SEC}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wallet_network
volumes:
  postgres_data:

networks:
  wallet_network:
    driver: bridge
